<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Shop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <button class="addBookBtn" onclick="onAddBook()">Add a new book!</button>

    <div class="add-book-modal">
        <h2>Add New Book</h2>

        <input class="book-title-input" type="text" placeholder="Book title">

        <input class="book-price-input" type="number" placeholder="Book price">

        <button onclick="onSaveBook()">Add Book</button>
        <button onclick="onCloseAddModal()">Cancel</button>

        <div class="add-error-msg"></div>
    </div>

    <input type="text" placeholder="Search by title" oninput="onFilter()" class="title-filter">

    <select onchange="onFilter()" class="rating-filter">
        <option value="0">All ratings</option>
        <option value="1">1 ⭐ and up</option>
        <option value="2">2 ⭐ and up</option>
        <option value="3">3 ⭐ and up</option>
        <option value="4">4 ⭐ and up</option>
        <option value="5">5 ⭐</option>
    </select>

    <button onclick="onClearFilter()">Clear</button>

    <select class="sort-by" onchange="onSort()">
        <option value="title">Title</option>
        <option value="price">Price</option>
        <option value="rating">Rating</option>
    </select>

    <label>
        <input type="radio" name="sort" value="asc" checked onchange="onSort()">
        Ascending
    </label>

    <label>
        <input type="radio" name="sort" value="desc" onchange="onSort()">
        Descending
    </label>

    <button onclick="onSetLayout('table')">Table</button>
    <button onclick="onSetLayout('grid')">Grid</button>

    <table class="books-table">
        <thead>
            <tr>
                <th>Title</th>
                <th>Price</th>
                <th>Rating</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody></tbody>
    </table>

    <div class="books-grid"></div>

    <div class="book-details-modal">
        <button class="close" onclick="onCloseModal()">Close</button>
        <div class="book-details"></div>
    </div>

    <div class="success-msg"></div>

    <footer class="stats">
        <div> Expensive: <span class="expensive-count">0</span></div>
        <div> Average: <span class="average-count">0</span></div>
        <div> Cheap: <span class="cheap-count">0</span></div>
    </footer>

    <script src="storage.service.js"></script>
    <script src="utils.js"></script>
    <script src="book.service.js"></script>
    <script src="book.controller.js"></script>

</body>


</html>
