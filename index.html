<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Shop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <button class="addBookBtn" onclick="onAddBook()">Add a new book!</button>

    <input type="text" placeholder="Search by title" oninput="onFilterByTitle(this.value)">

    <button onclick="onClearFilter()">Clear</button>

    <button onclick="onSetLayout('table')">Table</button>
    <button onclick="onSetLayout('grid')">Grid</button>

    <table class="books-table">
        <thead>
            <tr>
                <th>Title</th>
                <th>Price</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody></tbody>
    </table>

    <div class="books-grid"></div>

    <div class="book-details-modal">
        <button class="close" onclick="onCloseModal()">Close</button>
        <div class="book-details"></div>
    </div>

    <div class="success-msg"></div>

    <footer class="stats">
        <div> Expensive: <span class="expensive-count">0</span></div>
        <div> Average: <span class="average-count">0</span></div>
        <div> Cheap: <span class="cheap-count">0</span></div>
    </footer>

    <script src="storage.service.js"></script>
    <script src="book.service.js"></script>
    <script src="book.controller.js"></script>
    <script src="utils.js"></script>

</body>


</html>
